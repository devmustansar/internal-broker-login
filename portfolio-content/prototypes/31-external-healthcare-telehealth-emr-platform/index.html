  'Why are these claims likely to be denied?':`The 6 claims share 4 patterns the payer has denied before:<ul><li>Care plan not signed in the billing month (2).</li><li>Missing documentation of interactive contact or consent (2).</li><li>Fewer than 16 days of device data (1).</li><li>Insurance ID or diagnosis mismatch (1).</li></ul>5 of 6 fixes can be applied automatically.<span class="src">Denial model trained on 14 months of remittances</span>`,
  'Who should get a payment plan?':`9 patients have balances over $300 and a high chance of paying with a plan:<ul><li>Average balance $412; total $3.7k.</li><li>All have paid copays on time in the last 6 months.</li><li>Expected recovery with a plan: $3.6k vs. $1.1k without.</li></ul><span class="src">From payment history and A/R aging</span>`,
  'What did the agents do today?':`Since 6 AM:<ul><li>Scheduling scored 31 visits and sent 46 reminders for tomorrow.</li><li>Eligibility verified 28 of 31 visits overnight.</li><li>Monitoring flagged Herman Ambrose and Rasaq Amoda.</li><li>Claims scrubbed Friday's batch: 27 fixed, 6 need a person.</li></ul>${pendingCount?`${pendingCount()} actions are waiting for approval.`:''}<span class="src">From the agent audit trail</span>`,
  'Which agent needs my attention?':`The <b>claims</b> and <b>documents</b> agents each have an action waiting for a person. Clinical agents (triage, monitoring, scribe, medication) never act alone.<span class="src">From the approvals queue</span><div class="acts2">${BTN('Open approvals','data-go="approvals"')}</div>`,
  'Summarize this patient for a new team member':`See the summary at the top of Patient 360: it combines visits, readings, messages, CCM calls and billing in one paragraph, with the risk drivers underneath.<span class="src">Generated from the full record</span>`,
  'Summarize AI value for the board':`In the last 30 days the AI layer returned about <b>410 staff hours</b> and recovered <b>$8.1k</b> in revenue (CCM threshold, no-shows, denials). At Quure's size that's roughly <b>$250k a year</b> of value, before the RPM and Saturday-block decisions.<span class="src">From the value calculator and agent audit trail</span>`,
  'What if we enroll 100 more RPM patients?':`About <b>+$9.5k a month</b> once enrollment ramps (3 months), and BP control would rise roughly 4 points. Case managers would need about 5 hours a week more in total.<span class="src">Scenario model</span><div class="acts2"><button class="btn sm primary" data-act="wi-100">Try it</button></div>`,
  'Why is this recommended?':`Each decision is ranked by expected impact, using the same forecasts as the rest of the dashboard. Click a decision's "Why?" to see its evidence.`
};
const CHIPS = {
  exec:['Summarize last month for the board','Where are we short next month?'],
  clinical:['Who is at risk this week?','How safe is the AI scribe?'],
  revenue:['Why are these claims likely to be denied?','Who should get a payment plan?'],
  provider:['Summarize Herman before his visit','Who is at risk this week?'],
  patient:['Why is my blood pressure up?','What should I ask Dr. Rayford?'],
  coordinator:['Who can reach 20 minutes this week?','Summarize Rasaq Amoda'],
  frontdesk:['Find the next opening with a cardiologist','Who hasn’t paid today?'],
  admin:['Which provider has the most open time?','Summarize last month for the board']
};
const VIEW_CHIPS = { agents:['What did the agents do today?','Which agent needs my attention?'], approvals:['Which agent needs my attention?'], capacity:['Where are we short next month?','Which provider has the most open time?'], value:['Summarize AI value for the board'], forecasts:['What if we enroll 100 more RPM patients?'], patients:['Summarize this patient for a new team member','Who is at risk this week?'], claims:['Why are these claims likely to be denied?'], quality:['Who is at risk this week?'] };
function openAssist(q){
  const d=document.getElementById('drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
  const vlabel = S.view!=='dashboard' ? ` · ${navLabel()}` : '';
  document.getElementById('drScope').textContent=ROLES[S.role].scope+vlabel;
  const body=document.getElementById('drBody');
  if(body.dataset.role!==S.role){ body.dataset.role=S.role; body.innerHTML=`<div class="msg a">Hi ${esc(ROLES[S.role].short)}. I can see what’s on this screen. Ask me anything, or pick a suggestion.</div>`; }
  const chips=[...new Set([...(VIEW_CHIPS[S.view]||[]), ...CHIPS[S.role]])].slice(0,4);
  document.getElementById('drSugg').innerHTML=chips.map(c=>`<button class="sugg" data-ask="${esc(c)}">${esc(c)}</button>`).join('');
  if(q) ask(q); else setTimeout(()=>document.getElementById('drInput').focus(),250);
}
function closeAssist(){
  const d=document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('open');
}
function ask(q){
  const body=document.getElementById('drBody');
  body.insertAdjacentHTML('beforeend',`<div class="msg q">${esc(q)}</div><div class="msg a" id="pending"><span class="typing"><i></i><i></i><i></i></span></div>`);
  body.scrollTop=body.scrollHeight;
  setTimeout(()=>{
    const p=document.getElementById('pending'); if(!p) return;
    p.removeAttribute('id');
    p.innerHTML = ANSWERS[q] || `In this prototype I answer the suggested questions. In the live product I’d search ${ROLES[S.role].scope.replace('Answers from ','').toLowerCase()} to answer this, and show my sources.`;
    body.scrollTop=body.scrollHeight;
  },900);
}

/* ================= MENU + RENDER ================= */
function modsFor(role){ return MODULES.filter(m=>m.r.split(' ').includes(role)); }
function badgeFor(m){
  if(m.id==='approvals' || m.id==='agents'){ const n=pendingCount(); return n?[n,m.id==='approvals']:null; }
  const b=m.b&&m.b[S.role]; if(!b) return null;
  if(m.id==='notes' && S.role==='provider' && S.done['p-notes']) return null;
  if(m.id==='claims' && S.dec['r-claims']) return null;
  return [b, !!m.red];
}
function navLabel(){
  if(S.role==='patient') return (PATIENT_NAV.find(n=>n[0]===S.view)||[])[1] || ({telehealth:'Video visit',waiting:'Waiting room'})[S.view] || 'Quure';
  return (MODULES.find(m=>m.id===S.view)||{}).l || ({waiting:'Waiting room'})[S.view] || 'Quure';
}
function renderNav(){
  const nav=document.getElementById('nav');
  document.getElementById('sideTools').innerHTML = S.role==='patient' ? '' : `<label class="mfind">${ic('search')}<input id="mfind" placeholder="Find a module" value="${esc(S.mfind)}" aria-label="Find a module"></label><button class="tool" data-act="toggle-groups" title="Open or close all groups">${ic('menu')}</button><button class="tool" data-act="collapse" title="${S.collapsed?'Expand menu':'Collapse menu'}">${ic(S.collapsed?'open':'collapse')}</button>`;
  if(S.role==='patient'){
    nav.innerHTML = PATIENT_NAV.map(n=>`<button class="item" data-go="${n[0]}" ${S.view===n[0]?'aria-current="page"':''} title="${n[1]}">${ic(n[2])}<span class="lbl">${n[1]}</span>${n[3]?`<span class="badge">${n[3]}</span>`:''}</button>`).join('');
    return;
  }
  const mods=modsFor(S.role), q=S.mfind.trim().toLowerCase();
  nav.innerHTML = GROUPS.map(([g,label])=>{
    let items=mods.filter(m=>m.g===g); if(q) items=items.filter(m=>m.l.toLowerCase().includes(q));
    if(!items.length) return '';
    const closed = !q && S.closed[g];
    const hasRed = items.some(m=>{ const b=badgeFor(m); return b&&b[1]; });
    return `<div class="grp ${closed?'closed':''}"><button class="grp-h" data-grp="${g}"><span>${label}</span><span class="gdot ${hasRed?'on':''}"></span>${ic('chev','chev')}</button><div class="grp-items">${items.map(m=>{ const b=badgeFor(m);
      return `<button class="item" data-go="${m.id}" ${S.view===m.id?'aria-current="page"':''} title="${esc(m.l)}">${ic(m.i)}<span class="lbl">${esc(m.l)}</span>${b?`<span class="badge ${b[1]?'red':''}">${b[0]}</span>`:''}${m.nw?'<span class="new">AI</span>':''}</button>`; }).join('')}</div></div>`;
  }).join('') || `<p class="small muted" style="padding:10px">No module matches “${esc(S.mfind)}”.</p>`;
}
function render(){
  clearTimers();
  const R=ROLES[S.role];
  renderNav();
  document.body.classList.toggle('va', S.va);
  document.body.classList.toggle('collapsed', S.collapsed);
  document.getElementById('vaToggle').setAttribute('aria-pressed', S.va);
  document.getElementById('roleSel').value=S.role;
  document.getElementById('me').innerHTML = `${av(R.name,R.av)}<div class="who"><b>${esc(R.name)}</b><span>${esc(R.meta)}</span></div>`;
  const home = {exec:'Command center',clinical:'Clinical command center',revenue:'Revenue command center',provider:'Dashboard',coordinator:'Dashboard',frontdesk:'Today',admin:'Dashboard',patient:'My health'}[S.role];
  document.getElementById('pageTitle').textContent = S.view==='dashboard' ? home : (S.view==='patients' ? 'Patient 360' : navLabel());
  document.getElementById('pageSub').textContent = LONG(TODAY) + (S.view==='dashboard' ? ' · '+R.name : '');
  const v=S.view; let html='';
  if(v==='dashboard') html = ({exec:vExec, clinical:vClinical, revenue:vRevenue, provider:vProvider, patient:vPatient, coordinator:vCoordinator, frontdesk:vFrontdesk, admin:vAdmin})[S.role]();
  else if(v==='find') html=vFind();
  else if(v==='appointments') html = S.role==='patient'?vPatientAppts():vModule('appointments');
  else if(v==='waiting') html=vWaiting();
  else if(v==='telehealth') html = (S.role==='provider'||S.role==='patient') ? vTelehealth() : vModule('telehealth');
  else if(v==='agents') html=vAgents();
  else if(v==='approvals') html=vApprovals();
  else if(v==='value') html=vValue();
  else if(v==='capacity') html=vCapacity();
  else if(v==='patients') html=vP360();
  else if(v==='forecasts') html=vForecasts();
  else if(v==='hns') html=vHNS();
  else if(S.role==='patient' && v==='records') html=vRecords();
  else if(S.role==='patient' && v==='messages') html=vPtMessages();
  else if(S.role==='patient' && v==='payments') html=vPtPayments();
  else html=vModule(v);
  document.getElementById('view').innerHTML=html;
  renderFull();
  if(v==='telehealth' && !S.room.ended && (S.role==='provider'||S.role==='patient')) startRoomTimers();
  if(v==='agents') startAgentTimers();
  if(S.ccmTimer && v==='dashboard' && S.role==='coordinator'){
    timers.push(setInterval(()=>{S.ccmSec++; const b=document.querySelector('[data-act="ccm-timer"]'); if(b) b.innerHTML=ic('timer')+'Stop CCM timer '+String(Math.floor(S.ccmSec/60)).padStart(2,'0')+':'+String(S.ccmSec%60).padStart(2,'0');},1000));
  }
}
function go(view){ if(view==='find' && S.view!=='find') resetBooking(); S.view=view; render(); document.getElementById('view').focus({preventScroll:true}); window.scrollTo({top:0}); }
function resetRoom(){ S.room={mic:true,cam:true,tab:null,lines:0,signed:false,rxSent:false,ended:false}; }
function resetBooking(){ S.pick=null; S.slot=null; S.day=0; S.step=null; S.q=''; S.reason=''; S.spec='All'; }

/* ================= ACTIONS ================= */
const ACT = {
  'p-herman':()=>openAssist('Summarize Herman before his visit'),
  'p-rasaq':()=>{ S.done['p-rasaq']=1; toast('Message sent to Joann Evans'); render(); },
  'p-refills':()=>{ S.done['p-refills']=1; toast('2 refills sent to pharmacies'); render(); },
  'p-notes':()=>{ S.done['p-notes']=1; toast('3 notes signed'); render(); },
  'p-wait':()=>{ S.done['p-wait']=1; toast('Noah Patel held as backup for 3:40'); render(); },
  'start-visit':()=>{ resetRoom(); go('telehealth'); },
  'pt-log':()=>{ S.done['pt-log']=1; toast('Reading saved: 138/88 mmHg. Dr. Rayford can see it.'); render(); },
  'pt-refill':()=>{ S.done['pt-refill']=1; toast('Refill requested'); render(); },
  'pt-questions':()=>openAssist('What should I ask Dr. Rayford?'),
  'pt-remind':()=>toast('Reminder set for 10:15 AM'),
  'join':()=>{ resetRoom(); S.role==='patient' ? go('waiting') : go('telehealth'); },
  'admitted':()=>go('telehealth'),
  'end-visit':()=>{ S.room.ended=true; render(); },
  'send-rx':()=>{ S.room.rxSent=true; toast('E-prescription sent to CVS, Preston Rd'); if(S.room.ended) render(); else { const b=document.getElementById('tabBody'); if(b) b.innerHTML=roomTab(); } },
  'sign':()=>{ S.room.signed=true; toast('Note signed and added to Herman’s chart'); render(); },
  'share':()=>toast('Screen sharing starts here in the live product'),
  'anatomy':()=>toast('Opens the BioDigital 3D heart for both of you'),
  'edit-note':()=>toast('Editing opens here in the live product'),
  'to-confirm':()=>{ S.step='confirm'; render(); window.scrollTo({top:0}); },
  'back-times':()=>{ const r=document.getElementById('reason'); if(r) S.reason=r.value; S.step=null; render(); },
  'book':()=>{ const r=document.getElementById('reason'); if(r) S.reason=r.value; const d=DOCS.find(x=>x.id===S.pick);
     if(S.role==='patient') S.appts.splice(1,0,{d:dmd(DAYS[S.day]), t:S.slot, doc:d.n, s:d.s, type:S.vtype});
     S.step='done'; render(); window.scrollTo({top:0}); },
  'reset-book':()=>{ resetBooking(); render(); },
  'resched':()=>{ resetBooking(); go('find'); },
  'c-calvin':()=>{ document.querySelector('.draft')?.scrollIntoView({behavior:'smooth',block:'center'}); },
  'c-rasaq':()=>{ S.done['c-rasaq']=1; toast('Call logged, 12 minutes added to Rasaq’s CCM time'); PANEL[1].min=29; render(); },
  'c-remind':()=>{ S.done['c-remind']=1; toast('Reminders sent to 6 patients'); render(); },
  'c-send':()=>{ S.sent.calvin=1; S.done['c-calvin']=1; toast('Text sent to Calvin Anderson'); render(); },
  'c-plan':()=>toast('Care plan review opens here, pre-filled by Assist'),
  'ccm-timer':()=>{ if(S.ccmTimer){ const m=Math.max(1,Math.round(S.ccmSec/60)); S.ccmTimer=null; S.ccmSec=0; toast(`${m} minute${m>1?'s':''} logged to CCM time`); } else { S.ccmTimer=true; S.ccmSec=0; } render(); },
  'f-late':()=>{ S.done['f-late']=1; toast('2 patients texted a new arrival time'); render(); },
  'f-ins':()=>{ S.done['f-ins']=1; toast('Dolores Kim asked to upload a new insurance card'); render(); },
  'f-waitlist':()=>{ S.done['f-waitlist']=1; toast('Backup slots offered to 3 waitlisted patients'); render(); },
  'f-fax':()=>go('approvals'),
  'a-remind':()=>{ S.done['a-remind']=1; toast('Monday 2-hour reminder turned on'); render(); },
  'a-dea':()=>{ S.done['a-dea']=1; toast('Dr. Sullivan notified by email and in app'); render(); },
  'a-ccm':()=>go('billing'),
  'a-train':()=>toast('Reminder sent to 3 staff members'),
  'notify':()=>{ const n=pendingCount(); n?go('approvals'):toast('You’re all caught up'); },
  'listen':()=>{ const el=document.getElementById('brief'); if(!el||!('speechSynthesis' in window)) return toast('Read-aloud isn’t available in this browser');
     speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(el.textContent); u.rate=1.02; speechSynthesis.speak(u); toast('Reading your briefing aloud'); },
  'collapse':()=>{ S.collapsed=!S.collapsed; render(); },
  'toggle-groups':()=>{ const anyOpen=GROUPS.some(g=>!S.closed[g[0]]); GROUPS.forEach(g=>S.closed[g[0]]=anyOpen); render(); },
  'cap-full':()=>{ S.capFull=true; renderFull(); },
  'cap-close':()=>{ S.capFull=false; renderFull(); },
  'gap':()=>toast('Done. Logged to the patient’s timeline.'),
  'wi-reset':()=>{ S.wi={rpm:0,sat:0,rem:78,prov:0}; render(); },
  'wi-100':()=>{ S.wi.rpm=100; closeAssist(); go('forecasts'); }
};
const DEC_SIDE = { 'r-claims':()=>{ agentsInit(); S.sits.forEach(s=>s.acts.forEach(a=>{ if(a.dec==='r-claims') a.st='approved'; })); } };
function setDec(id, on){
  S.dec[id]=on?1:0; if(on && DEC_SIDE[id]) DEC_SIDE[id]();
  if(!on && id==='r-claims'){ agentsInit(); S.sits.forEach(s=>s.acts.forEach(a=>{ if(a.dec==='r-claims') a.st='pending'; })); }
  const d=allDecisions().find(x=>x.id===id);
  render(); if(on) toast(d.doneLabel, 'undo-'+id); else toast('Undone');
}
function saAct(idx,j,what){
  const s=S.sits[idx], a=s&&s.acts[j]; if(!a) return;
  if(what==='edit') return toast('Edit opens the draft before it’s sent');
  if(what==='approve'){ a.st='approved'; if(a.dec) S.dec[a.dec]=1; pushFeed('act', s.agent, 'Approved by '+ROLES[S.role].name+': '+a.t); toast('Approved and logged to the audit trail'); }
  if(what==='reject'){ a.st='rejected'; pushFeed('sig', s.agent, 'Rejected by '+ROLES[S.role].name); toast('Rejected. The agent won’t act.'); }
  if(what==='undo'){ a.st='undone'; pushFeed('sig', s.agent, 'Undone by '+ROLES[S.role].name+': '+a.t); toast('Undone'); }
  render();
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const t=e.target.closest('button, a'); if(!t) return;
  const ds=t.dataset;
  if(t.hasAttribute('data-open-assist')){ e.preventDefault(); openAssist(); return; }
  if(t.hasAttribute('data-close-assist')){ closeAssist(); return; }
  if(t.id==='vaToggle'){ S.va=!S.va; render(); if(S.va) toast('AI value-adds outlined'); return; }
  if(ds.ask){ openAssist(ds.ask); return; }
  if(ds.p360){ closeAssist(); S.p360=ds.p360; go('patients'); return; }
  if(ds.go){ e.preventDefault(); closeAssist(); S.capFull=false; go(ds.go); return; }
  if(ds.act && ds.act.startsWith('undo-')){ setDec(ds.act.slice(5), false); document.getElementById('toast').classList.remove('show'); return; }
  if(ds.act && ACT[ds.act]){ ACT[ds.act](); return; }
  if(ds.dec){ setDec(ds.dec, true); return; }
  if(ds.undo){ setDec(ds.undo, false); return; }
  if(ds.grp){ S.closed[ds.grp]=!S.closed[ds.grp]; renderNav(); return; }
  if(ds.sim){ runSim(ds.sim); return; }
  if(ds.sa){ const [i,j,w]=ds.sa.split(':'); saAct(+i,+j,w); return; }
  if(ds.auto){ const [id,m]=ds.auto.split(':'); S.autonomy[id]=m; toast(`${AGENTS.find(a=>a.id===id).n}: ${m==='auto'?'acts alone, with Undo':m==='ask'?'asks before acting':'suggests only'}. Change logged.`); render(); return; }
  if(ds.cap){ const k=ds.cap; if(k==='route'&&S.dec['x-route']){ S.dec['x-route']=0; S.cap.route=false; } else if(k==='sat'&&S.dec['x-sat']){ S.dec['x-sat']=0; S.cap.sat=false; } else S.cap[k]=!S.cap[k]; toast(S.cap[k]?'Applied. Changed cells are outlined in green.':'Undone'); render(); return; }
  if(ds.check!==undefined){ S.checks[ds.check]=!S.checks[ds.check]; render(); return; }
  if(ds.spec){ S.spec=ds.spec; render(); return; }
  if(ds.pick){ S.pick=ds.pick; S.slot=null; S.day=1; render(); return; }
  if(ds.day){ S.day=+ds.day; S.slot=null; render(); return; }
  if(ds.slot){ S.slot=ds.slot; render(); return; }
  if(ds.vtype){ const r=document.getElementById('reason'); if(r) S.reason=r.value; S.vtype=ds.vtype; render(); return; }
  if(ds.room){ S.room[ds.room]=!S.room[ds.room]; const keep=S.room.lines; render(); S.room.lines=keep; return; }
  if(ds.tab){ S.room.tab=ds.tab; document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===ds.tab)); document.getElementById('tabBody').innerHTML=roomTab(); return; }
  if(ds.move){ const [k,i]=ds.move.split(':'); const order=['arriving','waiting','withdoc','checkout']; const c=S.board[k].splice(+i,1)[0]; const n=order[order.indexOf(k)+1];
    if(n){ c.tags = n==='waiting'?[['ok','Checked in just now']]:n==='checkout'?[['warn','Copay due']]:[]; S.board[n].unshift(c); toast(`${c.n} moved to ${({waiting:'waiting',withdoc:'with provider',checkout:'checkout'})[n]}`);} else toast(`${c.n} checked out`);
    render(); return; }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='mfind'){ S.mfind=t.value; renderNav(); const i=document.getElementById('mfind'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); return; }
  if(t.dataset.roi){ S.roi[t.dataset.roi]=+t.value; const fmt={pts:v=>v.toLocaleString(),visits:v=>v.toLocaleString(),elig:v=>v+'%',cms:v=>v}[t.dataset.roi]; document.getElementById('roi-'+t.dataset.roi).textContent=fmt(+t.value); document.getElementById('roiOut').innerHTML=roiOut(); return; }
  if(t.dataset.wi){ S.wi[t.dataset.wi]=+t.value; const fmt={rpm:v=>'+'+v,sat:v=>v,rem:v=>v+'%',prov:v=>v?'Yes':'No'}[t.dataset.wi]; document.getElementById('wi-'+t.dataset.wi).textContent=fmt(+t.value); document.getElementById('wiOut').innerHTML=wiOut(); return; }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='findForm'){ e.preventDefault(); S.q=document.getElementById('findQ').value; S.spec='All'; S.pick=null; S.slot=null; render(); return; }
  if(e.target.id==='drForm'){ e.preventDefault(); const i=document.getElementById('drInput'); if(i.value.trim()){ ask(i.value.trim()); i.value=''; } }
});
document.addEventListener('change', e=>{
  if(e.target.id==='roleSel'){ S.role=e.target.value; S.view='dashboard'; S.mfind=''; resetBooking(); resetRoom(); closeAssist(); S.capFull=false; render(); window.scrollTo({top:0}); }
  if(e.target.id==='bookFor'){ S.bookFor=e.target.value; }
});
document.getElementById('scrim').addEventListener('click', closeAssist);
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const d=document.getElementById('drawer'); d.classList.contains('open')?closeAssist():openAssist(); return; }
  if(e.key==='Escape'){ closeAssist(); if(S.capFull){ S.capFull=false; renderFull(); } }
});
if(!/Mac|iPhone|iPad/.test(navigator.platform||'')) document.getElementById('kbd').textContent='Ctrl K';

agentsInit();
render();
})();

</script>
